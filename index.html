<!DOCTYPE html>
<html lang="zh-CN" data-theme-loading="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#B14A6B">
    <title>Mugen新标签页</title>
    <!--
        标签页图标必须在这里显式声明：
        Chrome 会把 manifest.icons 当作 chrome-extension:// 页面的兜底图标，
        而 Firefox 不会——moz-extension:// 页面若没有 <link rel="icon">，
        标签栏上就是一个空白图标（新标签页覆盖页尤其明显）。
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/image/logo/logo_girl-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/image/logo/logo_girl-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/image/logo/logo_girl-48.png" />
    <link rel="apple-touch-icon" href="/image/logo/logo_girl-128.png" />
    <style>
        html[data-theme-loading] body {
            opacity: 0;
            visibility: hidden;
        }
        html[data-theme-loaded] body {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease;
        }
    </style>
    <!-- 主题预加载脚本须为外部文件：扩展 CSP（script-src 'self'）禁止内联脚本，内联会导致白屏 -->
    <script src="/theme-preload.js"></script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
